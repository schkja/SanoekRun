<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SanökRun</title>
    <meta name="theme-color" content="#4fb8ff" />
    <meta name="description" content="Run, jump and turn through the forest. A free browser game you can add to your home screen." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SanökRun" />
    <!-- Not "black-translucent": with it, iOS home-screen apps get a viewport that is
         short by the status bar and leave a strip at the bottom of the screen. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="SanökRun" />
    <meta property="og:image" content="icons/icon-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <!-- The renderer canvas is injected here by the engine. -->
    <div id="game"></div>

    <!-- All UI lives in this overlay. See src/ui/ -->
    <div id="ui"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
