name: Check

# Vercel builds and deploys every push by itself (main → live site, other
# branches and pull requests → preview links). This only makes sure the code
# type-checks and builds, so a broken change shows up as a red mark on the PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: for f in api/*.mjs server/*.mjs scripts/*.mjs; do node --check "$f"; done
