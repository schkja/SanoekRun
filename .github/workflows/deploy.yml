name: Build and deploy

# Every push to main: check the code, build the game into a Docker image and
# publish it to GitHub's container registry. The server's Watchtower picks the
# new image up within a minute.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --check server/index.mjs

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sanoekrun:latest
            ghcr.io/${{ github.repository_owner }}/sanoekrun:${{ github.sha }}

      - name: Build and push the leaderboard image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sanoekrun-api:latest
            ghcr.io/${{ github.repository_owner }}/sanoekrun-api:${{ github.sha }}
