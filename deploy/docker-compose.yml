# Runs the game on the server. GitHub builds the image on every push to main;
# Watchtower sees the new image (it checks every minute) and restarts the game.
services:
  sanoekrun:
    image: ghcr.io/schkja/sanoekrun:latest
    container_name: sanoekrun
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
