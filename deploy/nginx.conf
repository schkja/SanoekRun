server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # No access log: the game doesn't need to know who visited (privacy page, point 3).
  access_log off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Built files have a content hash in their name, so they can be cached for ever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The offline worker must always be fresh, or players get stuck on an old version.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    types { }
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # The page itself is never cached, so players always get the latest version.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
